    <rect x="28" y="30" width="148" height="22" rx="11" fill="#155eef"/>
    <rect x="28" y="72" width="334" height="46" rx="12" fill="#e2e8f0"/>
    <rect x="28" y="138" width="94" height="94" rx="18" fill="#dff7f4"/>
    <rect x="148" y="138" width="94" height="94" rx="18" fill="#e8efff"/>
    <rect x="268" y="138" width="94" height="94" rx="18" fill="#f1eaff"/>
