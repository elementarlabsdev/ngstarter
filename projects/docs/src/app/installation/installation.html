<div class="px-20 py-10 prose dark:prose-invert max-w-full">
  <h1>Installation</h1>
  <main class="w-2/3">
    <h2>Automatic installation</h2>

    <p>If you don't have a project yet, create a new Angular 21 project (sass styles are mandatory):</p>

    <ngs-code-highlighter [code]="installProjectCommand()" language="bash"/>

    <p>Run the schematics from the Angular 21 project directory:</p>

    <ngs-code-highlighter [code]="addProjectSchematics()" language="bash"/>

    <p>
      The components will be installed and configured, then copy what you need from the demo layouts projects.
    </p>
  </main>
</div>
