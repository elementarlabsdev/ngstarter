<app-page>
  <h1 appPageTitle>Bar micro chart</h1>
  <div appPageContent>
    <h3>Basic bar micro chart</h3>
    <ngs-playground exampleUrl="_docs/micro-charts/bar-chart/_examples" exampleName="mchart-bar-basic-example">
      <app-mchart-bar-basic-example />
    </ngs-playground>

    <h3>Bar micro chart with custom bar radius</h3>
    <ngs-playground exampleUrl="_docs/micro-charts/bar-chart/_examples" exampleName="mchart-bar-custom-radius-example">
      <app-mchart-bar-custom-radius-example />
    </ngs-playground>

    <h3>Bar micro chart with bar highlight</h3>
    <ngs-playground exampleUrl="_docs/micro-charts/bar-chart/_examples" exampleName="mchart-bar-with-bar-highlight-example">
      <app-mchart-bar-with-bar-highlight-example />
    </ngs-playground>

    <h3>Bar micro chart fill bar with gradient</h3>
    <ngs-playground exampleUrl="_docs/micro-charts/bar-chart/_examples" exampleName="mchart-bar-fill-gradient-example">
      <app-mchart-bar-fill-gradient-example />
    </ngs-playground>

    <h3>Bar micro chart with tooltip</h3>
    <ngs-playground exampleUrl="_docs/micro-charts/bar-chart/_examples" exampleName="mchart-bar-with-tooltip-example">
      <app-mchart-bar-with-tooltip-example />
    </ngs-playground>

    <h3>Bar micro chart responsive</h3>
    <ngs-playground exampleUrl="_docs/micro-charts/bar-chart/_examples" exampleName="mchart-bar-responsive-example">
      <app-mchart-bar-responsive-example />
    </ngs-playground>
