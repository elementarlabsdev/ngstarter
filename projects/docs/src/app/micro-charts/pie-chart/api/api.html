<div class="border border-muted rounded-xl shadow-sm overflow-hidden my-6">
  <table ngs-table [dataSource]="properties">
    <ng-container ngsColumnDef="name">
      <th ngs-header-cell *ngsHeaderCellDef class="w-1/2">Prop</th>
      <td ngs-cell *ngsCellDef="let element">
        <div [innerHTML]="element.name"></div>
        <div class="text-xs text-neutral-600 mt-0.5">{{ element.description }}</div>
      </td>
    </ng-container>

    <ng-container ngsColumnDef="type">
      <th ngs-header-cell *ngsHeaderCellDef>Type</th>
      <td ngs-cell *ngsCellDef="let element">
        <code class="text-xs text-red-500 bg-red-50 px-1 py-0.5 rounded">{{ element.type }}</code>
      </td>
    </ng-container>

    <ng-container ngsColumnDef="default">
      <th ngs-header-cell *ngsHeaderCellDef>Default</th>
      <td ngs-cell *ngsCellDef="let element">
        <code class="text-xs text-neutral-600 bg-neutral-100 px-1 py-0.5 rounded">{{ element.default }}</code>
      </td>
    </ng-container>

    <tr ngs-header-row *ngsHeaderRowDef="['name', 'type', 'default']"></tr>
    <tr ngs-row *ngsRowDef="let row; columns: ['name', 'type', 'default'];"></tr>
  </table>
</div>
