<h3 ngs-dialog-title>Preview</h3>
<ngs-dialog-content>
  <div class="min-h-40 w-full min-w-0">
    @if (data.document.blocks.length > 0) {
      <ngs-content-editor-renderer [content]="data.document"/>
    } @else {
      <ngs-empty-state>Nothing to preview</ngs-empty-state>
    }
  </div>
</ngs-dialog-content>
<ngs-dialog-actions align="end">
  <button ngsButton ngs-dialog-close>Close</button>
</ngs-dialog-actions>
