<div class="flex flex-col gap-6">
  <ngs-form-builder [(schema)]="schema"/>

  <ngs-card>
    <ngs-card-header>
      <ngs-card-title>Current schema</ngs-card-title>
    </ngs-card-header>
    <ngs-card-content>
      <ngs-code-highlighter
        [code]="schemaCode()"
        language="json"
        appearance="none"
        disableOverflow/>
    </ngs-card-content>
  </ngs-card>
</div>
