<div class="mb-4 flex items-center gap-3">
  <button
    ngsButton="outlined"
    type="button"
    (click)="showOtherSignerFields.set(!showOtherSignerFields())"
  >
    {{ showOtherSignerFields() ? 'Hide other signer fields' : 'Show other signer fields' }}
  </button>
</div>

<ngs-pdf-signer
  class="block h-[720px]"
  [schema]="schema()"
  [signer]="currentSigner"
  [showOtherSignerFields]="showOtherSignerFields()"
  [stamps]="stamps"
  [uploadedSignatures]="uploadedSignatures"
  [uploadedInitials]="uploadedInitials"
  (schemaChange)="schema.set($event)"
/>
