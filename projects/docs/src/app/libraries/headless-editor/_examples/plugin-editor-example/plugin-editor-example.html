<div class="mb-3 flex flex-wrap gap-2">
  <button ngsButton="outlined" [ngsHeadlessEditorCommand]="toggleKeyboard">
    Key label
  </button>
  <button ngsButton="outlined" [ngsHeadlessEditorCommand]="setTextColor" commandData="#dc2626">
    Red text
  </button>
  <button ngsButton="outlined" [ngsHeadlessEditorCommand]="unsetTextColor">
    Clear text color
  </button>
  <button ngsButton="outlined" [ngsHeadlessEditorCommand]="setBackgroundColor" commandData="#fef08a">
    Yellow highlight
  </button>
  <button ngsButton="outlined" [ngsHeadlessEditorCommand]="unsetBackgroundColor">
    Clear highlight
  </button>
  <button ngsButton="outlined" [disabled]="!editor.canUndo()" (click)="editor.undo()">
    Undo
  </button>
  <button ngsButton="outlined" [disabled]="!editor.canRedo()" (click)="editor.redo()">
    Redo
  </button>
</div>

<div
  ngsHeadlessEditorSurface
  ariaLabel="Editor with a keyboard mark plugin"
  placeholder="Start typing…">
</div>

<details class="mt-4">
  <summary>Current JSON document</summary>
  <pre>{{ editor.document() | json }}</pre>
</details>
