<form class="form" novalidate>
  <ngs-form-field>
    <ngs-label>Title</ngs-label>
    <input ngsInput [formField]="form.title">
  </ngs-form-field>

  <app-rich-text-field
    [formField]="form.body"
    label="Announcement body"
    placeholder="Announcement body is"/>

  <div class="actions">
    <button type="button" ngsButton="outlined" (click)="loadSaved()">Load saved JSON</button>
    <button type="button" ngsButton="outlined" (click)="toggleDisabled()">
      {{ form.body().disabled() ? 'Enable body' : 'Disable body' }}
    </button>
    <span class="validity" [class.invalid]="!valid()">
      {{ valid() ? 'Form is valid' : 'Body is required' }}
      · touched: {{ form.body().touched() }}
    </span>
  </div>
</form>

<div class="outputs">
  <section>
    <h4>JSON (store this)</h4>
    <pre>{{ model().body | json }}</pre>
  </section>
  <section>
    <h4>HTML (derived)</h4>
    <pre>{{ html() }}</pre>
  </section>
  <section>
    <h4>Plain text (derived)</h4>
    <pre>{{ text() }}</pre>
  </section>
</div>
