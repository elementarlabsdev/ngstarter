<form class="form" [formGroup]="form">
  <ngs-form-field>
    <ngs-label>Title</ngs-label>
    <input ngsInput formControlName="title">
  </ngs-form-field>

  <app-rich-text-field
    formControlName="body"
    label="Announcement body"
    placeholder="Announcement body is required"/>

  <div class="actions">
    <button type="button" ngsButton="outlined" (click)="loadSaved()">Load saved JSON</button>
    <button type="button" ngsButton="outlined" (click)="toggleDisabled()">
      {{ form.controls.body.disabled ? 'Enable body' : 'Disable body' }}
    </button>
    <span class="validity" [class.invalid]="!valid()">
      {{ valid() ? 'Form is valid' : 'Body is required' }}
      · touched: {{ form.controls.body.touched }}
    </span>
  </div>
</form>

<div class="outputs">
  <section>
    <h4>JSON (store this)</h4>
    <pre>{{ form.getRawValue().body | json }}</pre>
  </section>
  <section>
    <h4>HTML (derived)</h4>
    <pre>{{ html() }}</pre>
  </section>
  <section>
    <h4>Plain text (derived)</h4>
    <pre>{{ text() }}</pre>
  </section>
</div>
