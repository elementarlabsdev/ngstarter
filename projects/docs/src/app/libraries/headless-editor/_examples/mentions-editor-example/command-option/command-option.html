<div class="flex min-w-64 items-center gap-3 py-1">
  <ngs-icon [name]="option().icon" class="size-6"/>
  <div class="flex flex-1 flex-col">
    <span class="font-mono text-sm">/{{ option().label }}</span>
    <span class="text-xs opacity-70">{{ option().description }}</span>
  </div>
  @if (active()) {
    <span class="text-xs opacity-70" aria-hidden="true">↵</span>
  }
</div>
