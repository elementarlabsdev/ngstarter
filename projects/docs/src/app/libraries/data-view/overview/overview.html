<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 mt-10 gap-6">
  @for (item of items; track item.routerLink) {
    <ngs-card [routerLink]="item.routerLink" class="cursor-pointer transition-colors hover:bg-emphasis" appearance="outlined">
      <ngs-card-header>
        <ngs-card-title>{{ item.title }}</ngs-card-title>
      </ngs-card-header>
      <ngs-card-content>
        <p class="text-secondary mb-0">{{ item.description }}</p>
      </ngs-card-content>
    </ngs-card>
  }
</div>
