<div class="w-1/2">
  <ngs-form-field class="w-full">
    <ngs-label>Password</ngs-label>
    <ngs-pass-toggle-visibility #toggle ngsSuffix/>
    <input [type]="toggle.type" ngsInput [formControl]="password" required autocomplete="off">
  </ngs-form-field>
  <ngs-password-strength [password]="password.value!" class="relative -top-4"/>
</div>
