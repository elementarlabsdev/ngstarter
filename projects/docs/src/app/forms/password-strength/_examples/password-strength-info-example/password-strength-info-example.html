<div class="w-1/2">
  <ngs-form-field class="w-full">
    <ngs-label>Password</ngs-label>
    <input type="text" ngsInput [formControl]="password" autocomplete="off">
    <ngs-hint align="end" aria-live="polite">
      {{ password.value?.length }} / 25
    </ngs-hint>
  </ngs-form-field>
  <ngs-password-strength #passwordStrengthComponent [password]="password.value!" />
  <ngs-password-strength-info [passwordComponent]="passwordStrengthComponent" />
</div>
