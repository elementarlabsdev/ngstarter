<div class="flex flex-col gap-4">
  <ngs-segmented [(ngModel)]="selectedPeriod">
    <ngs-segmented-button value="daily">Daily</ngs-segmented-button>
    <ngs-segmented-button value="weekly">Weekly</ngs-segmented-button>
    <ngs-segmented-button value="monthly">Monthly</ngs-segmented-button>
    <ngs-segmented-button value="yearly">Yearly</ngs-segmented-button>
  </ngs-segmented>

  <div class="text-sm text-neutral-600">
    Selected period: <strong>{{ selectedPeriod }}</strong>
  </div>

  <div class="flex gap-2">
    <button
      ngsButton="outlined"
      (click)="selectedPeriod = 'daily'"
    >
      Set Daily
    </button>
    <button
      ngsButton="outlined"
      (click)="selectedPeriod = 'yearly'"
    >
      Set Yearly
    </button>
  </div>
</div>
