<div class="grid gap-8 md:grid-cols-2">
  <div class="flex flex-col gap-4">
    <h4 class="text-sm font-medium">Vertical</h4>
    <ngs-radio-group orientation="vertical" aria-label="Notification frequency">
      <ngs-radio-button value="instant">Instant</ngs-radio-button>
      <ngs-radio-button value="daily">Daily summary</ngs-radio-button>
      <ngs-radio-button value="weekly">Weekly digest</ngs-radio-button>
    </ngs-radio-group>
  </div>

  <div class="flex flex-col gap-4">
    <h4 class="text-sm font-medium">Horizontal</h4>
    <ngs-radio-group orientation="horizontal" aria-label="Billing cycle">
      <ngs-radio-button value="monthly">Monthly</ngs-radio-button>
      <ngs-radio-button value="annual">Annual</ngs-radio-button>
    </ngs-radio-group>
  </div>
</div>
