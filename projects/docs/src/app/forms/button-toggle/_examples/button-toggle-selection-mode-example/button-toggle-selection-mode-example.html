<div>
  <p class="mt-0">Single selection:</p>
  <ngs-button-toggle-group name="favoriteColor" aria-label="Favorite Color">
    <ngs-button-toggle value="red">Red</ngs-button-toggle>
    <ngs-button-toggle value="green">Green</ngs-button-toggle>
    <ngs-button-toggle value="blue">Blue</ngs-button-toggle>
  </ngs-button-toggle-group>
</div>

<div class="mt-8">
  <p>Single selection (hidden indicator):</p>
  <ngs-button-toggle-group name="favoriteColorHidden" aria-label="Favorite Color Hidden" hideSelectionIndicator>
    <ngs-button-toggle value="red">Red</ngs-button-toggle>
    <ngs-button-toggle value="green">Green</ngs-button-toggle>
    <ngs-button-toggle value="blue">Blue</ngs-button-toggle>
  </ngs-button-toggle-group>
</div>

<div class="mt-8">
  <p>Multiple selection:</p>
  <ngs-button-toggle-group name="ingredients" aria-label="Ingredients" multiple>
    <ngs-button-toggle value="flour">Flour</ngs-button-toggle>
    <ngs-button-toggle value="eggs">Eggs</ngs-button-toggle>
    <ngs-button-toggle value="sugar">Sugar</ngs-button-toggle>
  </ngs-button-toggle-group>
</div>
