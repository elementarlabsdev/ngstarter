<ngs-form-field class="w-1/2">
  <ngs-label>Select an option</ngs-label>
  <ngs-select [(value)]="selected">
    <ngs-option>None</ngs-option>
    <ngs-option value="option1">Option 1</ngs-option>
    <ngs-option value="option2">Option 2</ngs-option>
    <ngs-option value="option3">Option 3</ngs-option>
  </ngs-select>
</ngs-form-field>
<p>You selected: {{ selected }}</p>
