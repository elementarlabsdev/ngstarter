<form novalidate>
  <ngs-form-field class="w-1/2">
    <ngs-label>Phone</ngs-label>
    <ngs-phone-input [formField]="form.phone" [onlyCountries]="['gb', 'us']"/>
    @if (form.phone().invalid()) {
      <ngs-error>Invalid phone</ngs-error>
    }
  </ngs-form-field>
</form>
<p>
  Value: {{ form.phone().value() }}
</p>
