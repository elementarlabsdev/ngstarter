<app-page>
  <h1 appPageTitle>Timezone</h1>
  <div appPageContent>
    <main class="mb-10">
      <p>
        The <code>ngs-timezone-select</code> component is a domain-specific form control for choosing an IANA time zone
        id such as <code>Europe/Warsaw</code> or <code>America/New_York</code>. Use it inside one
        <code>ngs-form-field</code> when a profile, tenant, calendar, report, or scheduling setting must store a time
        zone.
      </p>
    </main>
    <nav ngs-tab-nav-bar>
      <a routerLink="/forms/timezone" ngs-tab-link>Overview</a>
      <a routerLink="/forms/timezone/api" ngs-tab-link>Api</a>
    </nav>
    <ngs-tab-nav-panel>
      <router-outlet/>
    </ngs-tab-nav-panel>
  </div>
</app-page>
