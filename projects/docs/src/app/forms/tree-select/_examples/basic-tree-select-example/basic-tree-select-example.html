<ngs-form-field class="w-full max-w-96">
  <ngs-label>Department</ngs-label>
  <ngs-tree-select
    [nodes]="nodes"
    [formControl]="department"
    leavesOnly
    clearable
    required
    aria-label="Department"
  />
  @if (department.touched && department.invalid) {
    <ngs-error>Choose a department.</ngs-error>
  }
</ngs-form-field>
<p class="mt-3 text-sm">Selected: {{ department.value ?? 'None' }}</p>
