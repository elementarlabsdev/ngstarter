<div>
  <ngs-form-field class="w-92">
    <ngs-label>Date Format</ngs-label>
    <ngs-date-format-select [formField]="settingsForm.dateFormat" placeholder="Select a date format"/>

    @if (settingsForm.dateFormat().invalid() && settingsForm.dateFormat().touched()) {
      <ngs-error>Please select the date format.</ngs-error>
    }
  </ngs-form-field>
</div>

<div class="text-sm mt-2">
  @if (settingsForm.dateFormat().value()) {
    <p>Selected date format: {{ settingsForm.dateFormat().value() }}</p>
  } @else {
    <p>No date format selected.</p>
  }
</div>
