<app-page>
  <h1 appPageTitle>Autocomplete</h1>
  <div appPageContent>
    <h3 id="basic-button">Simple autocomplete</h3>
    <ngs-playground exampleUrl="_docs/forms/autocomplete/_examples" exampleName="simple-autocomplete-example">
      <app-simple-autocomplete-example/>
    </ngs-playground>

    <h3 id="custom-filter">Custom Filter</h3>
    <ngs-playground exampleUrl="_docs/forms/autocomplete/_examples" exampleName="autocomplete-filter-example">
      <app-autocomplete-filter-example/>
    </ngs-playground>

    <h3 id="separate-controls-and-display-values">Separate control and display values</h3>
    <ngs-playground exampleUrl="_docs/forms/autocomplete/_examples" exampleName="separate-controls-and-display-values-example">
      <app-separate-controls-and-display-values-example/>
    </ngs-playground>

    <h3 id="auto-highlight-first-person">Automatically highlighting the first option</h3>
    <ngs-playground exampleUrl="_docs/forms/autocomplete/_examples" exampleName="auto-highlight-first-person-example">
      <app-auto-highlight-first-person-example/>
    </ngs-playground>

    <h3 id="option-groups">Autocomplete with option groups</h3>
    <ngs-playground exampleUrl="_docs/forms/autocomplete/_examples" exampleName="option-groups-example">
      <app-option-groups-example/>
    </ngs-playground>
  </div>
</app-page>
