<ngs-form-field class="w-1/2">
  <ngs-label>Assignee</ngs-label>
  <input type="text" ngsInput [formControl]="myControl" [ngsAutocomplete]="auto">
  <ngs-autocomplete #auto="ngsAutocomplete" [displayWith]="displayFn">
    @for (option of filteredOptions | async; track option) {
      <ngs-option [value]="option">{{ option.name }}</ngs-option>
    }
  </ngs-autocomplete>
</ngs-form-field>
