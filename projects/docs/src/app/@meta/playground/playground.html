<div class="border border-subtle rounded-xl shadow-xs relative mb-14 mt-6 overflow-hidden bg-surface-container-lowest">
  <div class="p-7">
    <ng-content/>
  </div>
  @if (showSource) {
    @if (exampleLoading) {
      <div class="border-t border-t-subtle text-sm p-4">Loading...</div>
    } @else {
      <div class="border-t border-t-subtle">
        <markdown #markdownRef
                  [data]="src"
                  class="playground-markdown"
                  [clipboardButtonTemplate]="clipboardButtonTemplate" />
      </div>
    }
  }

  <div class="border-t border-t-subtle h-12 relative flex items-center justify-center
              gap-1 px-2 text-center bg-surface-container rounded-b-lg">
    @if (showSource) {
      <div class="flex items-center gap-2 absolute start-3 top-1/2 -translate-y-1/2">
        @if (htmlSrc) {
          <div class="rounded-full hover:bg-neutral-300 border border-muted border-neutral-950 px-2.5 py-1 text-sm cursor-pointer
                      dark:hover:bg-primary-500
                      dark:border-neutral-500 dark:text-white
                      [&.active]:text-white [&.active]:bg-primary-600"
               [class.active]="isCurrentTab('html')" (click)="selectTab('html')">HTML</div>
        }

        @if (tsSrc) {
          <div class="rounded-full hover:bg-neutral-300 border border-muted border-neutral-950 px-2.5 py-1 text-sm cursor-pointer
                      dark:hover:bg-primary-500
                      dark:border-neutral-500 dark:text-white
                      [&.active]:text-white [&.active]:bg-primary-600"
               [class.active]="isCurrentTab('ts')" (click)="selectTab('ts')">TS</div>
        }

        @if (cssSrc) {
          <div class="rounded-full hover:bg-neutral-300 border border-muted border-neutral-950 px-2.5 py-1 text-sm cursor-pointer
                      dark:hover:bg-primary-500
                      dark:border-neutral-500 dark:text-white
                      [&.active]:text-white [&.active]:bg-primary-600"
               [class.active]="isCurrentTab('css')" (click)="selectTab('css')">CSS</div>
        }
      </div>
    }

    <button ngsIconButton (click)="toggleSource()"
            [class.!bg-neutral-300]="showSource"
            [class.dark:!bg-neutral-600]="showSource">
      <ngs-icon name="fluent:code-24-regular"/>
    </button>

    @if (hasScr && showSource) {
      <button ngsIconButton (click)="contentCopy()">
        <ngs-icon name="fluent:copy-24-regular"/>
      </button>
    }
  </div>
</div>

<ng-template #clipboardButtonTemplate>
  <button ngsIconButton (click)="contentCopy()">
    <ngs-icon name="fluent:copy-24-regular"/>
  </button>
</ng-template>
