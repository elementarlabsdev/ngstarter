<div class="mt-6" [style.min-height.px]="fullscreenMode() ? inlineHeight() : null">
  <div #previewFrame class="playground-frame group/playground relative overflow-hidden rounded-xl border border-border bg-surface-container-lowest shadow-xs"
       [class.playground-expanded]="fullscreenMode() !== null">
    <div class="playground-preview p-7">
      <ng-content/>
    </div>

    <div class="relative flex h-12 shrink-0 items-center justify-center gap-1 border-t border-t-border bg-surface-container px-2">
      <button ngsIconButton type="button" aria-label="Example source" (click)="toggleSource()"
              [class.!bg-neutral-300]="showSource"
              [class.dark:!bg-neutral-600]="showSource">
        <ngs-icon name="fluent:code-24-regular"/>
      </button>
      @if (fullscreen() || fullscreenMode()) {
        <button ngsButton type="button" (click)="toggleFullscreen()">
          <ngs-icon [name]="fullscreenMode() ? 'fluent:full-screen-minimize-24-regular' : 'fluent:full-screen-maximize-24-regular'"/>
          {{ fullscreenMode() ? 'Exit fullscreen' : 'Fullscreen' }}
        </button>
      }
    </div>
  </div>
</div>

<ngs-drawer #sourceDrawer (closed)="onDrawerClosed()">
  <div class="playground-source-drawer h-full w-[90vw] max-w-[1200px] overflow-hidden lg:w-[60vw]">
    <ngs-layout class="h-full">
      <ngs-layout-header flex class="playground-source-toolbar h-12 items-center gap-3 border-b border-b-border px-4">
        <div class="flex min-w-0 flex-1 items-center gap-2">
          <ngs-icon name="fluent:window-dev-tools-24-regular" class="size-5" />
          <span class="truncate text-sm font-medium">Example source</span>
        </div>
        <button ngsIconButton aria-label="Close source drawer" (click)="sourceDrawer.close()" class="-me-2.5">
          <ngs-icon name="fluent:dismiss-24-regular" />
        </button>
      </ngs-layout-header>
      <ngs-layout-sidebar class="playground-source-sidebar w-72 border-e border-e-border p-2">
        <div class="px-3 pb-2 pt-1 text-xs font-medium uppercase tracking-wide text-neutral-500">
          Files
        </div>
        <ngs-navigation [activeKey]="currentTab" (itemClicked)="selectSourceTab($event)">
          @for (file of sourceFiles; track file.tab) {
            <ngs-navigation-item [key]="file.tab">
              <ngs-icon [name]="file.icon" ngsNavigationItemIcon />
              <span class="min-w-0 truncate">{{ fileNameFor(file) }}</span>
            </ngs-navigation-item>
          }
        </ngs-navigation>
      </ngs-layout-sidebar>
      <ngs-layout-content class="playground-source-main">
        <ngs-layout absolute>
          <ngs-layout-header class="border-b border-b-border">
            <div class="flex h-10 shrink-0 items-center gap-2 px-4">
              <ngs-icon [name]="currentSourceFile?.icon || 'fluent:code-24-regular'" />
              <span class="truncate text-sm">{{ currentFileName }}</span>
            </div>
          </ngs-layout-header>
          <ngs-layout-content class="playground-source-editor">
            <ngs-scrollbar-area>
              @if (exampleLoading) {
                <div class="p-5 text-sm text-neutral-500">Loading source...</div>
              } @else {
                <ngs-code-highlighter class="border border-border rounded-lg overflow-hidden h-full" [code]="code || ''"
                                      [language]="language"
                                      theme="github-light"
                                      showCopyButton
                                      disableOverflow
                                      appearance="none"/>
              }
            </ngs-scrollbar-area>
          </ngs-layout-content>
        </ngs-layout>
      </ngs-layout-content>
    </ngs-layout>
  </div>
</ngs-drawer>
