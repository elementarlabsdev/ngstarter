<div class="flex gap-10 px-10 py-14">
  <div class="grow">
    <div class="page-container lg:container lg:mx-auto prose dark:prose-invert max-w-full" [class.is-wide]="wide()">
      <div class="mb-14">
        <ng-content select="[appPageTitle]"/>
      </div>
      <ng-content select="[appPageContent]"/>

      @if (relatedLinks.length) {
        <section class="related-docs mt-10 py-6" aria-labelledby="related-docs-title">
          <div>
            <p class="related-docs-eyebrow">Related components</p>
            <h2 id="related-docs-title">Build the surrounding workflow</h2>
          </div>
          <div class="related-docs-grid">
            @for (link of relatedLinks; track link.href) {
              <a [routerLink]="link.href" class="related-docs-link">
                <span>{{ link.label }}</span>
                <small>{{ link.description }}</small>
              </a>
            }
          </div>
        </section>
      }
    </div>
  </div>
  @if (!wide()) {
    <nav class="sticky hidden lg:block top-32 w-72">
      <ng-content select="[appPageAside]"/>
    </nav>
  }
</div>
