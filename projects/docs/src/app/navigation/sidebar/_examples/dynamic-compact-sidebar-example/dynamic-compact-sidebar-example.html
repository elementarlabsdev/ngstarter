<div class="flex flex-col gap-4">
  <button ngsButton="tonal" type="button" class="w-fit" (click)="toggleCompact()">
    <ngs-icon [name]="compact() ? 'fluent:panel-left-expand-24-regular' : 'fluent:panel-left-contract-24-regular'"/>
    {{ compact() ? 'Expand sidebar' : 'Compact sidebar' }}
  </button>

  <div class="h-[420px] w-full relative border border-muted rounded-2xl overflow-hidden">
    <ngs-sidenav-container autosize hasBackdrop="false">
      <ngs-sidenav [opened]="true" mode="side" [collapsed]="compact()" disableClose>
        <ngs-sidebar class="border-r border-r-muted">
          <ngs-sidebar-header class="h-14 px-4 border-b border-b-muted text-primary font-bold">
            <span *ngsSidenavCollapsed>NG</span>
            <span *ngsSidenavExpanded>NgStarter</span>
          </ngs-sidebar-header>

          <ngs-sidebar-body>
            <ngs-sidebar-nav activeKey="home" class="p-4">
              @for (navItem of navItems; track navItem.key) {
                <ngs-sidebar-nav-item [key]="navItem.key" [attr.aria-label]="navItem.label">
                  <ngs-icon [name]="navItem.icon" ngsSidebarNavItemIcon/>
                  {{ navItem.label }}
                </ngs-sidebar-nav-item>
              }
            </ngs-sidebar-nav>
          </ngs-sidebar-body>

          <ngs-sidebar-footer class="h-14 px-4 border-t border-t-muted text-sm">
            <div *ngsSidenavCollapsed class="text-center w-full">WS</div>
            <span *ngsSidenavExpanded>Workspace</span>
          </ngs-sidebar-footer>
        </ngs-sidebar>
      </ngs-sidenav>
      <ngs-sidenav-content class="p-6">
        <div class="text-sm text-neutral-600">
          Sidebar content
        </div>
      </ngs-sidenav-content>
    </ngs-sidenav-container>
  </div>
</div>
