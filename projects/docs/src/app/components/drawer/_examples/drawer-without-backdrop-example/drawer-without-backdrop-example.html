<button ngsButton="filled" (click)="drawer.open()">Open Drawer</button>

<ngs-drawer #drawer="ngsDrawer" [showBackdrop]="false">
  <ngs-layout class="w-[460px]">
    <ngs-layout-header class="px-5 py-3">Header</ngs-layout-header>
    <ngs-layout-content class="p-5">
      <button ngsButton="filled" (click)="drawer.close()">Close Drawer</button>
    </ngs-layout-content>
    <ngs-layout-footer class="px-5 py-3">Footer</ngs-layout-footer>
  </ngs-layout>
</ngs-drawer>
