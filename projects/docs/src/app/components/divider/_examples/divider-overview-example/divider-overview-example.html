<div class="flex flex-col gap-8 py-6">
  <div>
    <p class="mb-2">Horizontal</p>
    <ngs-divider/>
  </div>

  <div>
    <p class="mb-2">Horizontal inset</p>
    <div class="border border-border rounded-md p-4">
      <div class="text-sm">Section 1</div>
      <ngs-divider inset class="my-4"/>
      <div class="text-sm">Section 2</div>
    </div>
  </div>

  <div>
    <p class="mb-2">Vertical</p>
    <div class="flex items-center h-32 gap-4">
      <div>Item 1</div>
      <ngs-divider vertical/>
      <div>Item 2</div>
      <ngs-divider vertical/>
      <div>Item 3</div>
    </div>
  </div>

  <div>
    <p class="mb-2">Vertical fixed height</p>
    <div class="flex items-center gap-4">
      <div>Item 1</div>
      <ngs-divider vertical fixedHeight/>
      <div>Item 2</div>
      <ngs-divider vertical fixedHeight/>
      <div>Item 3</div>
    </div>
  </div>
</div>
