<div class="border border-muted rounded-xl overflow-auto">
  <table ngs-table [dataSource]="dataSource" class="">
    <!-- Position Column -->
    <ng-container ngsColumnDef="position">
      <th ngs-header-cell *ngsHeaderCellDef class="text-neutral-500 dark:text-neutral-400 w-12 text-center"> No. </th>
      <td ngs-cell *ngsCellDef="let element"> {{element.position}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container ngsColumnDef="name">
      <th ngs-header-cell *ngsHeaderCellDef class="text-neutral-500 dark:text-neutral-400 w-64"> Name </th>
      <td ngs-cell *ngsCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container ngsColumnDef="weight">
      <th ngs-header-cell *ngsHeaderCellDef class="text-neutral-500 dark:text-neutral-400 w-32"> Weight </th>
      <td ngs-cell *ngsCellDef="let element"> {{element.weight}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container ngsColumnDef="symbol">
      <th ngs-header-cell *ngsHeaderCellDef class="text-neutral-500 dark:text-neutral-400 w-16 text-center"> Symbol </th>
      <td ngs-cell *ngsCellDef="let element"> {{element.symbol}} </td>
    </ng-container>

    <tr ngs-header-row *ngsHeaderRowDef="displayedColumns"></tr>
    <tr ngs-row *ngsRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <ngs-paginator [pageSizeOptions]="[5, 10, 20]"
                 pageSize="10"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements" class="border-t border-t-border py-2" />
</div>
