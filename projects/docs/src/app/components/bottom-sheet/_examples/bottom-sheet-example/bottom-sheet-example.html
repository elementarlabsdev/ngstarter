<ngs-list>
  <a href="https://keep.google.com/" ngs-list-item (click)="openLink($event)">
    <span ngsListItemTitle>Google Keep</span>
    <span ngsLine>Add to a note</span>
  </a>

  <a href="https://docs.google.com/" ngs-list-item (click)="openLink($event)">
    <span ngsListItemTitle>Google Docs</span>
    <span ngsLine>Embed in a document</span>
  </a>

  <a href="https://plus.google.com/" ngs-list-item (click)="openLink($event)">
    <span ngsListItemTitle>Google Plus</span>
    <span ngsLine>Share with your friends</span>
  </a>

  <a href="https://hangouts.google.com/" ngs-list-item (click)="openLink($event)">
    <span ngsListItemTitle>Google Hangouts</span>
    <span ngsLine>Show to your coworkers</span>
  </a>
</ngs-list>
