<div class="grid grid-cols-3 gap-4 sm:grid-cols-4 md:grid-cols-5">
  @for (type of types(); track type) {
    <div class="flex flex-col items-center gap-2 rounded-lg border border-border p-4">
      <ngs-file-type [extension]="type" class="size-16"/>
      <div class="text-xs uppercase text-secondary">{{ type }}</div>
    </div>
  }
</div>
