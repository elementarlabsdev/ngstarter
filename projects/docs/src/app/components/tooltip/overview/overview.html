<app-page>
  <h1 appPageTitle>Tooltip</h1>
  <div appPageContent>
    <h3>Basic Tooltip</h3>
    <ngs-playground exampleUrl="_docs/components/tooltip/_examples" exampleName="basic-tooltip-example">
      <app-basic-tooltip-example/>
    </ngs-playground>

    <h3>Tooltip With a Custom Position</h3>
    <ngs-playground exampleUrl="_docs/components/tooltip/_examples" exampleName="tooltip-with-a-custom-position-example">
      <app-tooltip-with-a-custom-position-example/>
    </ngs-playground>

    <h3>Tooltip show and hide delay</h3>
    <ngs-playground exampleUrl="_docs/components/tooltip/_examples" compact exampleName="tooltip-show-hide-delay-example">
      <app-tooltip-show-hide-delay-example/>
    </ngs-playground>

    <h3>Tooltip manually showing and hiding</h3>
    <ngs-playground exampleUrl="_docs/components/tooltip/_examples" compact exampleName="tooltip-manually-show-hide-example">
      <app-tooltip-manually-show-hide-example/>
    </ngs-playground>

    <h3>Tooltip disabled</h3>
    <ngs-playground exampleUrl="_docs/components/tooltip/_examples" compact exampleName="tooltip-disabled">
      <app-tooltip-disabled-example/>
    </ngs-playground>

    <h3>Tooltip position at origin</h3>
    <ngs-playground exampleUrl="_docs/components/tooltip/_examples" compact exampleName="tooltip-position-at-origin-example">
      <app-tooltip-position-at-origin-example/>
    </ngs-playground>
  </div>
</app-page>
