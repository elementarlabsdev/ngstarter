<p class="mb-4">Resize the window to see items moving to the overflow menu.</p>

<ngs-resizable-container class="border border-border rounded-xl p-4">
  <ngs-toolbar>
    <ngs-toolbar-title>Responsive Toolbar</ngs-toolbar-title>

    <ngs-toolbar-spacer />

    <ngs-toolbar-item>
      <button ngsButton>Action 1</button>
    </ngs-toolbar-item>

    <ngs-toolbar-item>
      <button ngsButton>Action 2</button>
    </ngs-toolbar-item>

    <ngs-toolbar-item>
      <button ngsButton>Action 3</button>
    </ngs-toolbar-item>

    <ngs-toolbar-item>
      <button ngsButton>Action 4</button>
    </ngs-toolbar-item>

    <ngs-toolbar-item>
      <button ngsIconButton>
        <ngs-icon name="fluent:settings-24-regular" />
      </button>
    </ngs-toolbar-item>

    <ngs-toolbar-item>
      <button ngsIconButton>
        <ngs-icon name="fluent:person-24-regular" />
      </button>
    </ngs-toolbar-item>
  </ngs-toolbar>
</ngs-resizable-container>
