<div class="w-[500px] bg-neutral-100 dark:bg-neutral-900 rounded-xl p-5 relative">
  <ngs-carousel #carousel>
    <ngs-carousel-card>
      <div class="border border-muted p-6 rounded-xl size-72 bg-surface-container-lowest">
        Card 1
      </div>
    </ngs-carousel-card>
    <ngs-carousel-card>
      <div class="border border-muted p-6 rounded-xl size-72 bg-surface-container-lowest">
        Card 2
      </div>
    </ngs-carousel-card>
    <ngs-carousel-card>
      <div class="border border-muted p-6 rounded-xl size-72 bg-surface-container-lowest">
        Card 3
      </div>
    </ngs-carousel-card>
    <ngs-carousel-card>
      <div class="border border-muted p-6 rounded-xl size-72 bg-surface-container-lowest">
        Card 4
      </div>
    </ngs-carousel-card>
    <ngs-carousel-card>
      <div class="border border-muted p-6 rounded-xl size-72 bg-surface-container-lowest">
        Card 5
      </div>
    </ngs-carousel-card>
    <ngs-carousel-card>
      <div class="border border-muted p-6 rounded-xl size-72 bg-surface-container-lowest">
        Card 6
      </div>
    </ngs-carousel-card>
  </ngs-carousel>
  <div class="absolute start-2 top-1/2 w-max -translate-y-1/2">
    <button ngsIconButton ngsCarouselPrevious [carousel]="carousel">
      <ngs-icon name="fluent:arrow-left-24-regular"/>
    </button>
  </div>
  <div class="absolute end-2 top-1/2 w-max -translate-y-1/2">
    <button ngsIconButton ngsCarouselNext [carousel]="carousel">
      <ngs-icon name="fluent:arrow-right-24-regular"/>
    </button>
  </div>
</div>
