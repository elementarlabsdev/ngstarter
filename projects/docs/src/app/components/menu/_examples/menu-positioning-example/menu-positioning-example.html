<div class="flex gap-4">
  <div>
    <button ngsButton [ngsMenuTriggerFor]="aboveMenu">Above</button>
    <ngs-menu #aboveMenu="ngsMenu" yPosition="above">
      <button ngs-menu-item>Item 1</button>
      <button ngs-menu-item>Item 2</button>
    </ngs-menu>
  </div>

  <div>
    <button ngsButton [ngsMenuTriggerFor]="belowMenu">Below</button>
    <ngs-menu #belowMenu="ngsMenu" yPosition="below">
      <button ngs-menu-item>Item 1</button>
      <button ngs-menu-item>Item 2</button>
    </ngs-menu>
  </div>

  <div>
    <button ngsButton [ngsMenuTriggerFor]="beforeMenu">Before</button>
    <ngs-menu #beforeMenu="ngsMenu" xPosition="before">
      <button ngs-menu-item>Item 1</button>
      <button ngs-menu-item>Item 2</button>
    </ngs-menu>
  </div>

  <div>
    <button ngsButton [ngsMenuTriggerFor]="afterMenu">After</button>
    <ngs-menu #afterMenu="ngsMenu" xPosition="after">
      <button ngs-menu-item>Item 1</button>
      <button ngs-menu-item>Item 2</button>
    </ngs-menu>
  </div>
</div>
