<div class="example-container">
  <h3>Medium-style Image Zoom</h3>
  <p>Click the image below to see it zoom to full screen.</p>

  <ngs-image-zoom-viewer>
    <img ngsImageZoomViewerImage
         src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80"
         alt="Forest"
         class="max-w-[400px]"
    />
  </ngs-image-zoom-viewer>

  <p>Another example with a different aspect ratio:</p>

  <ngs-image-zoom-viewer>
    <img ngsImageZoomViewerImage
         src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80"
         alt="Lake"
         class="max-w-[400px]"
    />
  </ngs-image-zoom-viewer>
</div>
