<ngs-events-list groupBy="week">
  <ngs-events-section label="This week">
    <ngs-event>
      <ngs-event-date weekday="Sat" day="21"/>
      <ngs-event-title>Octolane Weekly Review</ngs-event-title>
      <ngs-event-status tone="success">Confirmed</ngs-event-status>
      <ngs-event-time>9:00 - 10:00 AM</ngs-event-time>
      <ngs-avatar-group ngsEventActions>
        <ngs-avatar image="https://randomuser.me/api/portraits/men/32.jpg" label="AM" class="size-9"/>
        <ngs-avatar image="https://randomuser.me/api/portraits/men/46.jpg" label="MR" class="size-9"/>
      </ngs-avatar-group>
    </ngs-event>
  </ngs-events-section>

  <ngs-events-section label="Next week">
    <ngs-event>
      <ngs-event-date weekday="Mon" day="23"/>
      <ngs-event-title>POC Progress</ngs-event-title>
      <ngs-event-status tone="neutral">Draft</ngs-event-status>
      <ngs-event-time>9:00 - 9:15 AM</ngs-event-time>
      <ngs-avatar-group ngsEventActions>
        <ngs-avatar image="https://randomuser.me/api/portraits/men/32.jpg" label="AM" class="size-9"/>
        <ngs-avatar label="PO" class="size-9 bg-neutral-950 text-white"/>
      </ngs-avatar-group>
    </ngs-event>
  </ngs-events-section>
</ngs-events-list>
