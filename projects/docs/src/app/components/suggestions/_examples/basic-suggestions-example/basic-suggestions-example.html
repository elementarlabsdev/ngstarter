<ngs-suggestions class="rounded-b border border-muted w-[600px] p-4 flex flex-col gap-4">
  <ngs-suggestion-block heading="Recently Viewed">
    <ngs-suggestion>
      <ngs-icon name="fluent:options-24-regular" ngsSuggestionIcon/>
      <span>Settings</span> &ndash; <span class="text-neutral-400">My Profile</span>
    </ngs-suggestion>
    <ngs-suggestion>
      <ngs-icon name="fluent:data-usage-24-regular" ngsSuggestionIcon/>
      <span>Application statistics</span> &ndash; <span class="text-neutral-400">Admin Panel</span>
    </ngs-suggestion>
  </ngs-suggestion-block>
  <ngs-suggestion-block heading="Users">
    <ngs-suggestion>
      <ngs-avatar label="PS" ngsSuggestionThumb class="size-8"/>
      Pavel Salauyou
    </ngs-suggestion>
    <ngs-suggestion>
      <ngs-avatar image="assets/avatars/8.svg" label="JJ" ngsSuggestionThumb class="size-8"/>
      Jessica Jones
    </ngs-suggestion>
  </ngs-suggestion-block>
  <ngs-suggestion-block heading="Files">
    <ngs-suggestion>
      <div class="size-8 rounded-full bg-surface-container text-on-surface shadow-sm
                    flex items-center justify-center" ngsSuggestionThumb>
        <ngs-icon name="fluent:image-24-regular"/>
      </div>
      <span>Application flow.png</span> &ndash; <span class="text-neutral-400">30KB</span>
    </ngs-suggestion>
    <ngs-suggestion>
      <div class="size-8 rounded-full bg-surface-container text-on-surface shadow-sm
                    flex items-center justify-center" ngsSuggestionThumb>
        <ngs-icon name="fluent:document-text-24-regular"/>
      </div>
      <span>Monthly Report.pdf</span> &ndash; <span class="text-neutral-400">502KB</span>
    </ngs-suggestion>
  </ngs-suggestion-block>
  <ngs-suggestion-block heading="Create Team" showDivider inline>
    <button ngsButton="outlined">
      <ngs-icon name="fluent:add-24-regular"/>Create new team
    </button>
    <button ngsButton="outlined">
      <ngs-icon name="fluent:add-24-regular"/>Add new member
    </button>
  </ngs-suggestion-block>
</ngs-suggestions>
