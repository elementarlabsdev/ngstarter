<div class="flex flex-col gap-4">
  <ngs-card appearance="filled">
    <ngs-card-header>
      <ngs-card-title>Filled Card</ngs-card-title>
      <ngs-card-subtitle>Default appearance</ngs-card-subtitle>
    </ngs-card-header>
    <ngs-card-content>
      This is a filled card. It has a background color and no shadow or border.
    </ngs-card-content>
    <ngs-card-actions>
      <button ngsButton>ACTION</button>
    </ngs-card-actions>
  </ngs-card>

  <ngs-card appearance="outlined">
    <ngs-card-header>
      <ngs-card-title>Outlined Card</ngs-card-title>
      <ngs-card-subtitle>Simple border</ngs-card-subtitle>
    </ngs-card-header>
    <ngs-card-content>
      This is an outlined card. It has a border and no shadow.
    </ngs-card-content>
    <ngs-card-actions>
      <button ngsButton>ACTION</button>
    </ngs-card-actions>
  </ngs-card>

  <ngs-card appearance="raised">
    <ngs-card-header>
      <ngs-card-title>Raised Card</ngs-card-title>
      <ngs-card-subtitle>Shadow</ngs-card-subtitle>
    </ngs-card-header>
    <ngs-card-content>
      This is a raised card. It has a shadow to make it stand out from the background.
    </ngs-card-content>
    <ngs-card-actions>
      <button ngsButton>ACTION</button>
    </ngs-card-actions>
  </ngs-card>
</div>
