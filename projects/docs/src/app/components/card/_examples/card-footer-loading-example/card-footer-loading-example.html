<ngs-card class="w-1/2 overflow-hidden">
  <ngs-card-header>
    <ngs-card-subtitle>Dog Breed</ngs-card-subtitle>
    <ngs-card-title>Shiba Inu</ngs-card-title>
    <ngs-card-aside>
      <button ngsIconButton>
        <ngs-icon name="fluent:more-vertical-24-regular"/>
      </button>
    </ngs-card-aside>
  </ngs-card-header>
  <ngs-card-content class="pt-5">
    <p>This card has divider and indeterminate progress as footer</p>
    <p>{{ longText }}</p>
    <ngs-divider class="mt-4"/>
  </ngs-card-content>
  <ngs-card-actions>
    <button ngsButton>LIKE</button>
    <button ngsButton>SHARE</button>
  </ngs-card-actions>
  <ngs-card-footer>
    <ngs-progress-bar mode="indeterminate"/>
  </ngs-card-footer>
</ngs-card>

<ngs-card appearance="outlined" class="w-1/2 mt-8 overflow-hidden">
  <ngs-card-header>
    <ngs-card-subtitle>Dog Breed</ngs-card-subtitle>
    <ngs-card-title>Shiba Inu</ngs-card-title>
  </ngs-card-header>
  <ngs-card-content class="pt-5">
    <p>This card has divider and indeterminate progress as footer</p>
    <p>{{ longText }}</p>
    <ngs-divider class="mt-5"/>
  </ngs-card-content>
  <ngs-card-actions>
    <button ngsButton>LIKE</button>
    <button ngsButton>SHARE</button>
  </ngs-card-actions>
  <ngs-card-footer>
    <ngs-progress-bar mode="indeterminate"/>
  </ngs-card-footer>
</ngs-card>
