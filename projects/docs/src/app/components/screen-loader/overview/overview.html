<app-page>
  <h1 appPageTitle>Screen Loader</h1>
  <div appPageContent>
    <h3>Basic screen loader</h3>
    <ngs-playground exampleUrl="_docs/components/screen-loader/_examples" exampleName="basic-screen-loader-example">
      <app-basic-screen-loader-example/>
    </ngs-playground>

    <h2>API Reference</h2>
    <p>
      Properties for the <code class="code">ngs-screen-loader</code>.
    </p>

    <div class="border border-muted rounded-xl shadow-sm overflow-hidden mt-6 mb-6">
      <ngs-table [dataSource]="dataSource" ngSkipHydration>
        <ng-container ngsColumnDef="prop">
          <ngs-header-cell *ngsHeaderCellDef class="w-1/2">Prop</ngs-header-cell>
          <ngs-cell *ngsCellDef="let element">
            <div>{{ element.prop }}</div>
            <div class="text-xs text-neutral-600 mt-0.5">{{ element.description }}</div>
          </ngs-cell>
        </ng-container>

        <ng-container ngsColumnDef="type">
          <ngs-header-cell *ngsHeaderCellDef>Type</ngs-header-cell>
          <ngs-cell *ngsCellDef="let element">{{ element.type }}</ngs-cell>
        </ng-container>

        <ng-container ngsColumnDef="default">
          <ngs-header-cell *ngsHeaderCellDef>Default</ngs-header-cell>
          <ngs-cell *ngsCellDef="let element">{{ element.default }}</ngs-cell>
        </ng-container>

        <tr ngs-header-row *ngsHeaderRowDef="displayedColumns"></tr>
        <tr ngs-row *ngsRowDef="let row; columns: displayedColumns;"></tr>
      </ngs-table>
    </div>
  </div>
</app-page>
