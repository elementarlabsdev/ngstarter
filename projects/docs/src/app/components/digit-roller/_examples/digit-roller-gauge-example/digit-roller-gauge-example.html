<div class="grid gap-6 rounded-lg border border-neutral-200 bg-white p-6 sm:grid-cols-[auto_minmax(0,1fr)] sm:items-center" ngsDigitRollerGroup>
  <ngs-gauge class="size-28" [value]="score()" [radius]="50" [strokeWidth]="8">
    <ngs-gauge-value>
      <ngs-digit-roller
        class="text-xl font-bold leading-none text-primary"
        [value]="score()"
        [format]="integerFormat"
        suffix="%"
        [continuous]="true"
        [stagger]="12"
      />
    </ngs-gauge-value>
  </ngs-gauge>

  <div>
    <p class="text-sm font-medium text-neutral-900">Health score</p>
    <p class="mt-1 text-sm leading-6 text-neutral-500">
      The same value drives the gauge arc and the animated number in the center.
    </p>
  </div>
</div>
