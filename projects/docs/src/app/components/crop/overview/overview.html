<h3>Basic image crop</h3>

<div class="mb-5 mt-5">
  <ngs-form-field class="w-72">
    <ngs-select [(ngModel)]="cropShape" placeholder="Shape">
      <ngs-option value="rectangle">Rectangle</ngs-option>
      <ngs-option value="circle">Circle</ngs-option>
    </ngs-select>
  </ngs-form-field>
</div>

@if (selection()) {
  <div class="mb-5">{{ selection() | json }}</div>
}

<ngs-crop [shape]="cropShape()" (selectionApplied)="onSelectionApplied($event)">
  <img src="https://images.pexels.com/photos/34492076/pexels-photo-34492076.jpeg" width="500" alt="">
</ngs-crop>
