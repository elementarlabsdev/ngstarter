<div class="flex flex-col gap-8 p-4 bg-background border rounded-xl relative overflow-hidden min-h-[1200px]">
  <div>
    <button ngsButton="filled" (click)="startTour()" class="w-fit">Start Backdrop Tour</button>
  </div>

  <!-- Level 1: Root level block -->
  <div ngsTourAnchor="level1" class="p-6 border-2 border-primary border-dashed rounded-lg bg-primary/5 text-primary text-center">
    Level 1: Root Block
    <div class="mt-2">
      <button ngsButton="outlined" size="sm" (click)="onLevel1Click()">Click me!</button>
    </div>
  </div>

  <!-- Level 2: Nested block -->
  <div class="p-8 bg-secondary/10 border border-secondary rounded-2xl">
    <div class="mb-4 text-sm font-medium text-secondary">Container Level 2</div>
    <div ngsTourAnchor="level2" class="p-4 border-2 border-secondary border-dashed rounded-lg bg-surface text-secondary text-center">
      Level 2: Nested Block
      <div class="mt-2">
        <input type="checkbox" id="check2"> <label for="check2">Selectable text</label>
      </div>
    </div>
  </div>

  <!-- Level 3: Deeply nested and positioned block -->
  <div class="mt-[600px] relative h-32 bg-muted/20 rounded-xl p-4">
    <div class="text-xs text-muted-foreground">Relative Container (Scrolled down)</div>
    <div class="absolute bottom-4 right-4 p-4 bg-error/10 border border-error rounded-xl">
      <div ngsTourAnchor="level3" class="px-4 py-2 border-2 border-error border-dashed rounded-lg bg-surface text-error text-center">
        Level 3: Absolute Block
      </div>
    </div>
  </div>
</div>
