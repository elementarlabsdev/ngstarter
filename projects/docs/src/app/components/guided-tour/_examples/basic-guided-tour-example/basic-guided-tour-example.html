  <div class="flex gap-4">

      Step 1 Anchor
    </div>

    <div ngsTourAnchor="step2" class="p-4 border border-muted rounded-xl shadow-sm bg-surface text-on-surface">
      Step 2 Anchor
    </div>

    <div ngsTourAnchor="step3" class="p-4 border border-muted rounded-xl shadow-sm bg-surface text-on-surface">
