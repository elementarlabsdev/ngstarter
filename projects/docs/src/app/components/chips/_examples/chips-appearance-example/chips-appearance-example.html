<div class="example-section">
  <h4>Filled (Default)</h4>
  <ngs-chip-set>
    <ngs-chip>One</ngs-chip>
    <ngs-chip>Two</ngs-chip>
    <ngs-chip>Three</ngs-chip>
  </ngs-chip-set>
</div>

<div class="example-section">
  <h4>Outlined</h4>
  <ngs-chip-set>
    <ngs-chip appearance="outlined">One</ngs-chip>
    <ngs-chip appearance="outlined">Two</ngs-chip>
    <ngs-chip appearance="outlined">Three</ngs-chip>
  </ngs-chip-set>
</div>

<div class="example-section">
  <h4>Custom Styles (via appearance)</h4>
  <ngs-chip-set>
    <ngs-chip appearance="success">Success</ngs-chip>
    <ngs-chip appearance="warning">Warning</ngs-chip>
    <ngs-chip appearance="danger">Danger</ngs-chip>
    <ngs-chip appearance="gradient">Gradient</ngs-chip>
  </ngs-chip-set>
</div>
