<app-page>
  <h1 appPageTitle>Timepicker</h1>
  <div appPageContent>
    <main class="mb-10">
      <p>
        The Timepicker component is a form control for choosing a time of day. Use
        <code>input[ngsTimepicker]</code> inside one <code>ngs-form-field</code>, connect it to
        <code>ngs-timepicker</code>, and add <code>ngs-timepicker-toggle</code> as a suffix button when users should open
        the dropdown from an icon.
      </p>
    </main>
    <nav ngs-tab-nav-bar>
      <a routerLink="/components/timepicker" ngs-tab-link>Overview</a>
      <a routerLink="/components/timepicker/api" ngs-tab-link>Api</a>
    </nav>
    <ngs-tab-nav-panel>
      <router-outlet/>
    </ngs-tab-nav-panel>
  </div>
</app-page>
