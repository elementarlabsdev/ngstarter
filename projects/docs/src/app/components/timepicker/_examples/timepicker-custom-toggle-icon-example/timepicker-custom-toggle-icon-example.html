<ngs-form-field>
  <ngs-label>Pick a time</ngs-label>
  <input ngsInput [ngsTimepicker]="picker">
  <ngs-timepicker-toggle ngsIconButtonSuffix [for]="picker">
    <ngs-icon name="fluent:chevron-down-24-regular" class="size-5"
              ngsTimepickerToggleIcon/>
  </ngs-timepicker-toggle>
  <ngs-timepicker #picker/>
</ngs-form-field>
