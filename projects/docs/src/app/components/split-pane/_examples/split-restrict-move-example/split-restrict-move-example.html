<div class="h-[300px] border border-border rounded-lg overflow-hidden">
  <ngs-split direction="horizontal" [restrictMove]="true">
    <ngs-split-pane [size]="30">
      <div class="p-4 h-full flex flex-col items-center justify-center text-center bg-surface-container-low">
        Left Column
      </div>
    </ngs-split-pane>
    <ngs-split-pane [size]="40">
      <div class="p-4 h-full flex flex-col items-center justify-center text-center bg-surface-container-low">
        Middle Column
      </div>
    </ngs-split-pane>
    <ngs-split-pane [size]="30">
      <div class="p-4 h-full flex flex-col items-center justify-center text-center bg-surface-container-low">
        Right Column
      </div>
    </ngs-split-pane>
  </ngs-split>
</div>
