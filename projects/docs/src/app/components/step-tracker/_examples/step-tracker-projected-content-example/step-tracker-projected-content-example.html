<ngs-step-tracker class="max-w-md">
  <ngs-step-tracker-item state="completed">
    <ngs-step-tracker-label>Company profile</ngs-step-tracker-label>
    <ngs-step-tracker-description>
      Legal entity, billing address, and tax details are complete.
    </ngs-step-tracker-description>
  </ngs-step-tracker-item>
  <ngs-step-tracker-item state="current">
    <ngs-step-tracker-label>Payroll settings</ngs-step-tracker-label>
    <ngs-step-tracker-description>
      Select pay schedule, overtime policy, and default approvals.
    </ngs-step-tracker-description>
  </ngs-step-tracker-item>
  <ngs-step-tracker-item state="pending">
    <ngs-step-tracker-label>Team review</ngs-step-tracker-label>
    <ngs-step-tracker-description>
      Confirm employees and approvers before the first payroll run.
    </ngs-step-tracker-description>
  </ngs-step-tracker-item>
</ngs-step-tracker>
