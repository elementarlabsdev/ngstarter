<ngs-step-tracker orientation="horizontal">
  <ngs-step-tracker-item state="completed">
    <ngs-step-tracker-label>Account</ngs-step-tracker-label>
    <ngs-step-tracker-description>Verified</ngs-step-tracker-description>
  </ngs-step-tracker-item>
  <ngs-step-tracker-item state="current">
    <ngs-step-tracker-label>Billing</ngs-step-tracker-label>
    <ngs-step-tracker-description>In review</ngs-step-tracker-description>
  </ngs-step-tracker-item>
  <ngs-step-tracker-item state="error">
    <ngs-step-tracker-label>Documents</ngs-step-tracker-label>
    <ngs-step-tracker-description>Missing file</ngs-step-tracker-description>
  </ngs-step-tracker-item>
  <ngs-step-tracker-item state="disabled">
    <ngs-step-tracker-label>Approval</ngs-step-tracker-label>
    <ngs-step-tracker-description>Locked</ngs-step-tracker-description>
  </ngs-step-tracker-item>
</ngs-step-tracker>
