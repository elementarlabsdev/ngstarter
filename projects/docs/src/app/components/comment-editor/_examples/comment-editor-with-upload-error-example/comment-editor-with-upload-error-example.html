<ngs-comment-editor
  class="rounded-xl border border-border"
  fullViewMode
  toolbarAlwaysVisible
  [imageUploadFn]="rejectUpload">
  <ngs-comment-editor-toolbar>
    <button ngsIconButton ngsCommentEditorCommand ngsCommentEditorCommandImage
            aria-label="Upload an image that will fail">
      <ngs-icon name="fluent:image-24-regular"/>
    </button>
  </ngs-comment-editor-toolbar>
</ngs-comment-editor>
