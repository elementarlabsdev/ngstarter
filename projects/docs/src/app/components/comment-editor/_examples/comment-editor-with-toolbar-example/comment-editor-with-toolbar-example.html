<ngs-comment-editor class="rounded-xl border border-border" toolbarAlwaysVisible fullViewMode>
  <ngs-comment-editor-toolbar>
    <button ngsIconButton ngsCommentEditorCommand ngsCommentEditorCommandBold aria-label="Bold">
      <ngs-icon name="fluent:text-bold-24-regular"/>
    </button>
    <button ngsIconButton ngsCommentEditorCommand ngsCommentEditorCommandItalic aria-label="Italic">
      <ngs-icon name="fluent:text-italic-24-regular"/>
    </button>
    <button ngsIconButton ngsCommentEditorCommand ngsCommentEditorCommandStrike aria-label="Strike">
      <ngs-icon name="fluent:text-strikethrough-24-regular"/>
    </button>
  </ngs-comment-editor-toolbar>
</ngs-comment-editor>
