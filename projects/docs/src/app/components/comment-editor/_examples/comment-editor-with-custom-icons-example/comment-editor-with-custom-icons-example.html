<ngs-comment-editor class="rounded-xl border border-border">
  <ngs-comment-editor-toolbar>
    <span class="text-sm text-neutral-600">Your projected toolbar can contain any controls.</span>
  </ngs-comment-editor-toolbar>
  <ngs-comment-editor-footer-bar>
    <button ngsIconButton ngsCommentEditorCommand ngsCommentEditorCommandToggleToolbar
            aria-label="Toggle custom toolbar">
      <ngs-icon name="fluent:paint-brush-24-regular"/>
    </button>
  </ngs-comment-editor-footer-bar>
</ngs-comment-editor>
