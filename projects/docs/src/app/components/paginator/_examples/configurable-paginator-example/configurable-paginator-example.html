<div class="w-1/2">
  <ngs-form-field class="w-full">
    <ngs-label>Length</ngs-label>
    <input ngsInput placeholder="Length" type="number" [(ngModel)]="length">
  </ngs-form-field>

  <ngs-form-field class="w-full">
    <ngs-label>Page Size</ngs-label>
    <input ngsInput placeholder="Page Size" type="number" [(ngModel)]="pageSize">
  </ngs-form-field>

  <ngs-form-field class="w-full">
    <ngs-label>Page Index</ngs-label>
    <input ngsInput placeholder="Page Index" type="number" [(ngModel)]="pageIndex">
  </ngs-form-field>

  <ngs-form-field class="w-full">
    <ngs-label>Page Size Options</ngs-label>
    <input ngsInput [ngModel]="pageSizeOptions" (ngModelChange)="setPageSizeOptions($event)"
           [ngModelOptions]="{updateOn: 'blur'}" placeholder="Ex. 10,25,50">
  </ngs-form-field>

  <div class="flex flex-col gap-4">
    <ngs-slide-toggle [(ngModel)]="hidePageSize" class="w-full">Hide page size</ngs-slide-toggle>
    <ngs-slide-toggle [(ngModel)]="showPageSizeOptions" class="w-full">Show multiple page size options</ngs-slide-toggle>
    <ngs-slide-toggle [(ngModel)]="showFirstLastButtons" class="w-full">Show first/last buttons</ngs-slide-toggle>
    <ngs-slide-toggle [(ngModel)]="disabled" class="w-full">Disabled</ngs-slide-toggle>
  </div>
</div>

<div class="my-8">
  <ngs-paginator #paginator
                 (page)="handlePageEvent($event)"
                 [length]="length"
                 [pageSize]="pageSize"
                 [disabled]="disabled"
                 [showFirstLastButtons]="showFirstLastButtons"
                 [pageSizeOptions]="showPageSizeOptions ? pageSizeOptions : []"
                 [hidePageSize]="hidePageSize"
                 [pageIndex]="pageIndex"
                 aria-label="Select page" />
</div>

<div class="text-sm">
  <div> Output event: {{ (pageEvent | json) || 'No events dispatched yet' }} </div>
  <div> Number Of Pages: {{ paginator.getNumberOfPages() }} </div>
</div>
