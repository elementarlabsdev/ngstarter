<div class="relative p-4 h-full flex flex-col">
  <div class="pb-2.5 border-b-2 border-purple-500 flex items-center justify-between">
    <div class="font-semibold">Todo's</div>
    <button ngsButton="outlined">
      <ngs-icon name="fluent:add-24-regular"/>New Task
    </button>
  </div>
  <div class="mt-3 overflow-y-auto grow">
    <table ngs-table [dataSource]="dataSource" class=" table"
           cdkDropList (cdkDropListDropped)="drop($event)">
      <ng-container ngsColumnDef="drag">
        <th ngs-header-cell *ngsHeaderCellDef class="w-1 !px-0"></th>
        <td ngs-cell *ngsCellDef="let row" class="!px-0">
          <ngs-icon name="fluent:grid-dots-24-regular" class="font-icon relative top-[2px] text-neutral-500 hover:text-primary cursor-move"
                    cdkDragHandle/>
        </td>
      </ng-container>
      <ng-container ngsColumnDef="select">
        <th ngs-header-cell *ngsHeaderCellDef class="w-1 !px-0"></th>
        <td ngs-cell *ngsCellDef="let row" class="!px-0">
          <ngs-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)"
                        [aria-label]="checkboxLabel(row)" />
        </td>
      </ng-container>
      <ng-container ngsColumnDef="position">
        <th ngs-header-cell *ngsHeaderCellDef class="text-neutral-500 dark:text-neutral-400 w-1">#</th>
        <td ngs-cell *ngsCellDef="let element">{{ element.position }}</td>
      </ng-container>
      <ng-container ngsColumnDef="name">
        <th ngs-header-cell *ngsHeaderCellDef class="text-neutral-500 dark:text-neutral-400 w-1/2">Task name</th>
        <td ngs-cell *ngsCellDef="let element">{{ element.name }}</td>
      </ng-container>
      <ng-container ngsColumnDef="assignee">
        <th ngs-header-cell *ngsHeaderCellDef class="text-neutral-500 dark:text-neutral-400">Assignee</th>
        <td ngs-cell *ngsCellDef="let element">{{ element.assignee.name }}</td>
      </ng-container>
      <ng-container ngsColumnDef="priority">
        <th ngs-header-cell *ngsHeaderCellDef class="text-neutral-500 dark:text-neutral-400">Priority</th>
        <td ngs-cell *ngsCellDef="let element">
          @switch (element.priority.id) {
            @case ('high') {
              <div class="bg-rose-500 font-semibold text-white text-2xs w-max rounded-full h-6 px-3 flex items-center">
                {{ element.priority.name }}
              </div>
            }

            @case ('medium') {
              <div class="bg-amber-500 font-semibold text-white text-2xs w-max h-6 px-3 rounded-full flex items-center">
                {{ element.priority.name }}
              </div>
            }

            @case ('low') {
              <div class="bg-secondary-500 font-semibold text-white text-2xs w-max h-6 px-3 rounded-full flex items-center">
                {{ element.priority.name }}
              </div>
            }
          }
        </td>
      </ng-container>
      <tr ngs-header-row *ngsHeaderRowDef="displayedColumns"></tr>
      <tr ngs-row *ngsRowDef="let row; columns: displayedColumns;"
          class="hover:bg-primary-50 dark:hover:bg-neutral-700 row"
          [class.is-selected]="selection.isSelected(row)" cdkDrag cdkDragLockAxis="y">
        <td class="table-row-drag-placeholder" *cdkDragPlaceholder colspan="6"></td>
      </tr>
    </table>
  </div>
</div>
