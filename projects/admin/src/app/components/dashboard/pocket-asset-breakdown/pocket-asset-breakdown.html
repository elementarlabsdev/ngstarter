<ngs-card appearance="outlined" class="h-full overflow-hidden [--ngs-card-bg:var(--minto-card-shell-bg)] [--ngs-card-border-color:var(--minto-card-border)] [--ngs-card-border-radius:var(--minto-card-radius)]">
  <div class="px-6 py-5 font-bold text-[var(--minto-muted-text)]">Pocket asset breakdown</div>
  <div class="min-h-86 rounded-[var(--minto-card-radius)] border border-[var(--minto-card-border)] bg-[var(--minto-card-bg)] px-6 py-7">
    <p class="m-0 text-[var(--minto-muted-text)]">Your money moved <span class="font-extrabold text-[var(--ngs-color-primary)]">+4.1%</span> compared to last month</p>
    <h2 class="mb-7 mt-2 text-[1.75rem] leading-tight">4 pockets</h2>

    <div class="mb-8 flex h-11 gap-2" aria-hidden="true">
      @for (asset of content(); track asset.name) {
        <span class="min-w-8 rounded-full border border-black/5" [style.background]="asset.color" [style.flex-grow]="asset.value"></span>
      }
    </div>

    <div class="grid grid-cols-2 gap-4 text-center md:grid-cols-4">
      @for (asset of content(); track asset.name) {
        <div class="grid justify-items-center gap-3 text-[var(--minto-muted-text)]">
          <span class="inline-flex size-12 items-center justify-center rounded-full text-white" [style.background]="asset.accent">
            <ngs-icon [name]="asset.icon" />
          </span>
          <span>{{ asset.name }} - <strong>{{ asset.percent }}</strong></span>
        </div>
      }
    </div>
  </div>
</ngs-card>
