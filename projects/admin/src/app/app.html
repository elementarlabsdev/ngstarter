<ngs-layout root class="bg-[var(--minto-page-bg)] text-[var(--ngs-color-on-surface)]">
  <ngs-layout-content>
    <ngs-sidenav-container autosize autoFocus="false" hasBackdrop="false" class="bg-[var(--minto-page-bg)]">
      <ngs-sidenav
        [opened]="true"
        mode="side"
        fixedWidth="296"
        [adaptive]="false"
        class="[--ngs-sidenav-background-color:var(--minto-sidebar-bg)]"
      >
        <ngs-scrollbar-area scrollbarWidth="6px" class="[--ngs-scrollbar-area-thumb-bg:var(--minto-dashed-line)]">
          <aside class="flex min-h-full flex-col gap-5 bg-[var(--minto-sidebar-bg)] px-3 py-4" aria-label="Main navigation">
            <div class="flex items-center gap-3 border-b border-dashed border-[var(--minto-dashed-line)] px-1 pb-4 text-[1.35rem] font-extrabold">
              <span class="inline-flex size-10 flex-none items-center justify-center rounded-[var(--ngs-radius-lg)] bg-[var(--ngs-color-primary)] text-[var(--ngs-color-on-primary)] shadow-[0_10px_22px_color-mix(in_srgb,var(--ngs-color-primary),transparent_72%)]">
                <ngs-icon name="fluent:wallet-credit-card-24-filled" />
              </span>
              <span>{{ brandName() }}</span>
            </div>

            <ngs-navigation
              activeKey="dashboard"
              class="[--ngs-navigation-item-height:3rem] [--ngs-navigation-items-gap:.5rem] [--ngs-navigation-item-padding:0_1.25rem] [--ngs-navigation-item-border-radius:1.75rem] [--ngs-navigation-item-font-weight:500] [--ngs-navigation-item-hover-bg:var(--minto-soft-surface)] [--ngs-navigation-item-active-bg:var(--minto-active-bg)] [--ngs-navigation-item-active-color:var(--ngs-color-on-surface)]"
            >
              @for (item of primaryNav(); track item.key) {
                <button ngs-navigation-item [key]="item.key" class="border-0 bg-transparent text-left font-medium">
                  <ngs-icon [name]="item.icon" ngsNavigationItemIcon />
                  {{ item.label }}
                </button>
              }
            </ngs-navigation>

            <ngs-navigation
              class="border-t border-dashed border-[var(--minto-dashed-line)] pt-4 [--ngs-navigation-item-height:3rem] [--ngs-navigation-items-gap:.5rem] [--ngs-navigation-item-padding:0_1.25rem] [--ngs-navigation-item-border-radius:1.75rem] [--ngs-navigation-item-font-weight:500] [--ngs-navigation-item-hover-bg:var(--minto-soft-surface)] [--ngs-navigation-item-active-bg:var(--minto-active-bg)] [--ngs-navigation-item-active-color:var(--ngs-color-on-surface)]"
            >
              @for (item of secondaryNav(); track item.key) {
                <button ngs-navigation-item [key]="item.key" class="border-0 bg-transparent text-left font-medium">
                  <ngs-icon [name]="item.icon" ngsNavigationItemIcon />
                  {{ item.label }}
                </button>
              }
            </ngs-navigation>

            <ngs-navigation
              class="mt-auto [--ngs-navigation-item-height:3rem] [--ngs-navigation-items-gap:.5rem] [--ngs-navigation-item-padding:0_1.25rem] [--ngs-navigation-item-border-radius:1.75rem] [--ngs-navigation-item-font-weight:500] [--ngs-navigation-item-hover-bg:var(--minto-soft-surface)] [--ngs-navigation-item-active-bg:var(--minto-active-bg)] [--ngs-navigation-item-active-color:var(--ngs-color-on-surface)]"
            >
              @for (item of utilityNav(); track item.key) {
                <button ngs-navigation-item [key]="item.key" class="border-0 bg-transparent text-left font-medium">
                  <ngs-icon [name]="item.icon" ngsNavigationItemIcon />
                  {{ item.label }}
                </button>
              }
            </ngs-navigation>
          </aside>
        </ngs-scrollbar-area>
      </ngs-sidenav>

      <ngs-sidenav-content>
        <ngs-scrollbar-area scrollbarWidth="6px" class="[--ngs-scrollbar-area-thumb-bg:var(--minto-dashed-line)]">
          <section class="min-h-full rounded-[2rem] bg-[var(--minto-workspace-bg)] px-6 py-8 xl:mr-5 xl:my-5 xl:px-10 xl:py-12">
            <header class="mb-10 flex flex-wrap items-start justify-between gap-6">
              <h1 class="whitespace-nowrap text-[clamp(1.75rem,2vw,2.35rem)] font-[850] leading-[1.05]">
                Dashboard overview
              </h1>

              <div class="flex flex-wrap justify-end gap-3">
                <button ngsButton="outlined">
                  <ngs-icon name="fluent:arrow-download-24-filled" />
                  Deposit
                </button>
                <button ngsButton="outlined">
                  <ngs-icon name="fluent:arrow-upload-24-filled" />
                  Withdraw
                </button>
                <button ngsButton="outlined">
                  <ngs-icon name="fluent:arrow-swap-24-regular" />
                  Transfer
                </button>
                <button ngsButton="filled" class="[--ngs-button-filled-bg:var(--ngs-color-primary)] [--ngs-button-filled-color:var(--ngs-color-on-primary)] font-extrabold">
                  <ngs-icon name="fluent:add-circle-24-filled" />
                  New transaction
                </button>
              </div>
            </header>

            <ngs-grid
              plain
              [configs]="dashboardGridConfigs()"
              [items]="dashboardGridItems()"
              class="[--ngs-grid-gap:--spacing(5)]"
            />
          </section>
        </ngs-scrollbar-area>
      </ngs-sidenav-content>
    </ngs-sidenav-container>
  </ngs-layout-content>
</ngs-layout>
