<app-widget-shell [title]="content().title" [subtitle]="content().subtitle">
  <div class="activity-widget">
    <div class="timeline-rail"></div>
    <button ngsButton="tonal" type="button" class="activity-token token-green">
      <ngs-icon name="fluent:cart-24-regular" />
      <span>
        <strong>10:20 AM</strong>
        <small>45 min</small>
      </span>
    </button>
    <button ngsButton="tonal" type="button" class="activity-token token-blue">
      <ngs-icon name="fluent:eye-24-regular" />
      <span>
        <strong>11:15 AM</strong>
        <small>45 min</small>
      </span>
    </button>
  </div>
</app-widget-shell>
