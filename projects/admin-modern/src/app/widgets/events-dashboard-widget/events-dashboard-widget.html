<app-widget-shell [title]="content().title" [subtitle]="content().subtitle" [events]="true">
  <table ngs-table [dataSource]="events" class="events-table rounded-2xl overflow-hidden">
    <ng-container ngsColumnDef="type">
      <th ngs-header-cell *ngsHeaderCellDef>Review Type</th>
      <td ngs-cell *ngsCellDef="let row">
        <ngs-chip appearance="filled" class="event-chip" [class.tone-warm]="row.tone === 'warm'" [class.tone-green]="row.tone === 'green'" [class.tone-blue]="row.tone === 'blue'">
          {{ row.type }}
        </ngs-chip>
      </td>
    </ng-container>

    <ng-container ngsColumnDef="id">
      <th ngs-header-cell *ngsHeaderCellDef>Asset ID</th>
      <td ngs-cell *ngsCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <ng-container ngsColumnDef="date">
      <th ngs-header-cell *ngsHeaderCellDef>Date</th>
      <td ngs-cell *ngsCellDef="let row">{{ row.date }}</td>
    </ng-container>

    <ng-container ngsColumnDef="time">
      <th ngs-header-cell *ngsHeaderCellDef>Time</th>
      <td ngs-cell *ngsCellDef="let row">{{ row.time }}</td>
    </ng-container>

    <ng-container ngsColumnDef="action">
      <th ngs-header-cell *ngsHeaderCellDef></th>
      <td ngs-cell *ngsCellDef="let row">
        <button ngsIconButton type="button" aria-label="Open review" ngsTooltip="Open review">
          <ngs-icon name="fluent:play-24-filled" />
        </button>
      </td>
    </ng-container>

    <tr ngs-header-row *ngsHeaderRowDef="eventColumns"></tr>
    <tr ngs-row *ngsRowDef="let row; columns: eventColumns"></tr>
  </table>
</app-widget-shell>
