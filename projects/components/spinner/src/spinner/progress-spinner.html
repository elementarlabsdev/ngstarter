<ng-template #circle>
  <svg [attr.viewBox]="_viewBox()" class="ngs-circular-progress__indeterminate-circle-graphic"
       xmlns="http://www.w3.org/2000/svg" focusable="false">
    <circle [attr.r]="_circleRadius()"
            [style.stroke-dasharray.px]="_strokeCircumference()"
            [style.stroke-dashoffset.px]="_strokeCircumference() / 2"
            [style.stroke-width.%]="_circleStrokeWidth()"
            cx="50%" cy="50%"/>
  </svg>
</ng-template>

<div class="ngs-circular-progress__determinate-container" aria-hidden="true" #determinateSpinner>
  <svg [attr.viewBox]="_viewBox()" class="ngs-circular-progress__determinate-circle-graphic"
       xmlns="http://www.w3.org/2000/svg" focusable="false">
    <circle [attr.r]="_circleRadius()"
            [style.stroke-dasharray.px]="_strokeCircumference()"
            [style.stroke-dashoffset.px]="_strokeDashOffset()"
            [style.stroke-width.%]="_circleStrokeWidth()"
            class="ngs-circular-progress__determinate-circle"
            cx="50%" cy="50%"/>
  </svg>
</div>
<div class="ngs-circular-progress__indeterminate-container" aria-hidden="true">
  <div class="ngs-circular-progress__spinner-layer">
    <div class="ngs-circular-progress__circle-clipper ngs-circular-progress__circle-left">
      <ng-container [ngTemplateOutlet]="circle" />
    </div>
    <div class="ngs-circular-progress__gap-patch">
      <ng-container [ngTemplateOutlet]="circle" />
    </div>
    <div class="ngs-circular-progress__circle-clipper ngs-circular-progress__circle-right">
      <ng-container [ngTemplateOutlet]="circle" />
    </div>
  </div>
</div>
