<div class="inputs">
  @for (digit of digits(); track $index) {
    <ngs-form-field subscriptHiddenIfEmpty>
      <input #digitInput
             type="text"
             ngsInput
             ngsPinInput
             [value]="digit"
             [acceptOnly]="acceptOnly()"
             [placeholder]="placeholder()"
             [disabled]="disabled()"
             [readOnly]="readonly()"
             (input)="onInput(digitInput, $index)"
             (keydown.backspace)="onBackspace(digitInput, $index)"
             maxlength="1">
    </ngs-form-field>
  }
</div>
