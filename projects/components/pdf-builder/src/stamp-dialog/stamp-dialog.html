<h3 ngs-dialog-title>Stamp</h3>

<ngs-dialog-content>
  <ngs-tab-group animationDuration="0ms" ngs-stretch-tabs="false">
    <ngs-tab label="Upload">
      <ngs-upload-container class="mt-3">
        <ngs-upload-area
          ngsUploadTrigger
          accept="image/*"
          (fileSelected)="handleFileSelected($event)"
        >
          <ngs-icon name="fluent:arrow-upload-24-regular" ngsUploadAreaIcon />
          <ng-container ngsUploadAreaMainState>
            <div class="flex flex-col items-center gap-2">
              <strong>Drag & drop a stamp file here</strong>
              <span>or</span>
              <button ngsButton="filled" type="button">Choose a local file</button>
            </div>
          </ng-container>
          <ng-container ngsUploadAreaDropState>
            Drop stamp file here.
          </ng-container>
          <ng-container ngsUploadAreaInvalidState>
            Select an image file.
          </ng-container>
        </ngs-upload-area>
        <ngs-upload-allowed-types>Image files are accepted.</ngs-upload-allowed-types>
      </ngs-upload-container>

      @if (selectedFile(); as file) {
        <p class="mt-3 text-sm text-on-surface-variant">Selected file: {{ file.name }}</p>
      }
    </ngs-tab>

    @if (savedStamps().length) {
      <ngs-tab label="Uploaded stamps">
        <div class="mt-3 flex flex-col gap-3" aria-label="Uploaded stamps">
          @for (stamp of savedStamps(); track stamp.id) {
            <button
              class="my-stamp-option flex w-full items-center gap-4 rounded-lg border border-border bg-surface p-3 text-left transition hover:bg-surface-container-low"
              type="button"
              [class.border-primary]="selectedStamp()?.id === stamp.id"
              [class.bg-primary-container]="selectedStamp()?.id === stamp.id"
              [attr.aria-pressed]="selectedStamp()?.id === stamp.id"
              (click)="selectStamp(stamp)"
            >
              <span class="flex h-16 w-40 shrink-0 items-center justify-center rounded bg-surface-container-low px-4 py-2">
                <img class="my-stamp-image max-h-full max-w-full object-contain" [src]="getStampAssetImage(stamp)" [alt]="stamp.name" />
              </span>
              <span class="flex min-w-0 flex-col">
                <span class="truncate text-sm text-on-surface">{{ stamp.name }}</span>
                @if (stamp.description) {
                  <span class="truncate text-xs text-on-surface-variant">{{ stamp.description }}</span>
                }
              </span>
            </button>
          }
        </div>
      </ngs-tab>
    }
  </ngs-tab-group>
</ngs-dialog-content>

<ngs-dialog-actions align="end">
  <button ngsButton ngs-dialog-close>Cancel</button>
  <button ngsButton="filled" type="button" [disabled]="!canApply()" (click)="apply()">Accept and apply</button>
</ngs-dialog-actions>
