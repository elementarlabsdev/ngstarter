<ngs-select
  [value]="value()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  (touch)="touch.emit()"
  (selectionChange)="onSelectionChange($event)"
  (focus)="onFocus()"
  (blur)="onBlur()"
  [placeholder]="placeholder">
  @for (format of dateFormats(); track format.value) {
    <ngs-option [value]="format.value">{{ format.name }}</ngs-option>
  }
</ngs-select>
