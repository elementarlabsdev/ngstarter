<ng-content/>
@for (area of displayedAreas; track area; let index = $index; let last = $last) {
  @if (!last) {
    <div
      #gutterEls
      class="ngs-split-gutter"
      [style.flex-basis.px]="gutterSize()"
      [style.order]="index * 2 + 1"
      (mousedown)="startDragging($event, index * 2 + 1, index + 1)"
      (touchstart)="startDragging($event, index * 2 + 1, index + 1)"
      (mouseup)="clickGutter($event, index + 1)"
      (touchend)="clickGutter($event, index + 1)"
    >
      <div class="ngs-split-gutter-handle" [class.has-dots]="shouldShowHandle(index)">
        @if (shouldShowHandle(index)) {
          <div class="ngs-split-gutter-dot"></div>
          <div class="ngs-split-gutter-dot"></div>
          <div class="ngs-split-gutter-dot"></div>
        }
      </div>
    </div>
  }
}
