@if (dataSource(); as data) {
  <div class="inner">
    <div class="content">
      @for (item of data; track item) {
        <ng-container *ngTemplateOutlet="getTemplate(item); context: { $implicit: item }" />
      }
    </div>
  </div>
} @else {
  <div class="inner">
    <div class="content">
      <ng-content/>
    </div>
  </div>
}
