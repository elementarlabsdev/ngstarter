@if (control() && config()) {
  <ngs-form-field>
    <ngs-label>{{ config().label }}</ngs-label>
    <ngs-select [formControl]="control()">
      @for (option of options; track option.value) {
        <ngs-option [value]="option.value">{{ option.label }}</ngs-option>
      }
    </ngs-select>
    <ngs-hint>{{ config().hint }}</ngs-hint>
    @if (control().invalid && control().touched) {
      <ngs-error>{{ getErrorMessage() }}</ngs-error>
    }
  </ngs-form-field>
}
