@if(control() && config()) {
  <ngs-form-field>
    <ngs-label>{{ config().label }}</ngs-label>
    <textarea ngsInput
              [formControl]="control()"
              [placeholder]="config().placeholder || ''"
              [readonly]="config().readonly"
              ngsTextareaAutoSize></textarea>
    <ngs-hint>{{ config().hint }}</ngs-hint>
    @if (control().invalid && control().touched) {
      <ngs-error>{{ getErrorMessage() }}</ngs-error>
    }
  </ngs-form-field>
}
