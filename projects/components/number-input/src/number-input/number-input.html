<input #input type="number" class="number-input"
       [attr.min]="min()"
       [attr.max]="max()"
       [step]="step()"
       (input)="inputChange($event)">
<div class="controls">
  <button class="control control-decrease" ngsRipple [disabled]="isDecreaseDisabled()" (click)="decrease($event, input)">
    @if (_decreaseControlRef()) {
      <ng-template [ngTemplateOutlet]="_decreaseControlTemplateRef"/>
    } @else {
      <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M3.5 8h9"/>
      </svg>
    }
  </button>
  <button class="control control-increase" ngsRipple [disabled]="isIncreaseDisabled()" (click)="increase($event, input)">
    @if (_increaseControlRef()) {
      <ng-template [ngTemplateOutlet]="_increaseControlTemplateRef"/>
    } @else {
      <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M8 3.5v9M3.5 8h9"/>
      </svg>
    }
  </button>
</div>
