<button type="button"
        ngsRipple
        class="ngs-button-toggle-button"
        [attr.id]="id() + '-button'"
        [disabled]="isDisabled"
        [attr.name]="name()"
        [attr.aria-pressed]="isChecked"
        (click)="_onButtonClick()">
  @if (_hasSelectionIndicator && isChecked) {
    <ngs-icon name="fluent:checkmark-24-regular" class="ngs-button-toggle-selection-indicator" />
  }
  <span class="ngs-button-toggle-label-content">
    <ng-content />
  </span>
</button>
