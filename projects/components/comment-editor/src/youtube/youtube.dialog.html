<form class="w-[500px] max-w-full" (ngSubmit)="submit()">
  <h3 ngs-dialog-title>{{ isUpdate ? 'Update YouTube' : 'Add YouTube' }}</h3>
  <ngs-dialog-content>
    <div class="pt-4">
      <ngs-form-field class="w-full">
        <ngs-label>Paste URL</ngs-label>
        <input name="linkUrl" ngsInput [(ngModel)]="linkUrl">
      </ngs-form-field>
    </div>
  </ngs-dialog-content>
  <div ngs-dialog-actions align="end">
    <button type="button" ngsButton (click)="cancel()">Cancel</button>
    <button type="submit" ngsButton="filled" [disabled]="!linkUrl.trim()">
      {{ isUpdate ? 'Save' : 'Add URL' }}
    </button>
  </div>
</form>
