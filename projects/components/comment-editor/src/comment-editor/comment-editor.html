@if ((isToolbarVisible || toolbarAlwaysVisible()) && (isFullViewVisible || fullViewMode())) {
  <div class="toolbar">
    <ng-content select="ngs-comment-editor-toolbar"/>
  </div>
}
<div #content class="content prose dark:prose-invert max-w-full"></div>
<div class="editor-content">
  <ng-content/>
</div>
<div class="footer">
  <div class="flex items-center gap-0.5 grow pe-3">
    <ng-content select="ngs-comment-editor-footer-bar"/>
  </div>
  <div class="flex items-center gap-2">
    @if ((isFullViewVisible && !fullViewMode()) || cancelButtonAlwaysVisible()) {
      <button ngsButton (click)="cancel($event)">{{ buttonCancelLabel() }}</button>
    }
    <button ngsButton="filled"
            [disabled]="(!allowEmptyContent() && !_value) || null"
            [loading]="loading()"
            (click)="send($event)">{{ buttonSendLabel() }}
    </button>
  </div>
</div>
<div #imageBubbleMenu class="ngs-comment-editor-bubble-menu">
</div>
<div #bubbleMenu>
  <ng-content select="ngs-comment-editor-bubble-menu"/>
</div>
