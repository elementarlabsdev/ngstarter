@if (commentEditor.api.isActive('link') && getLinkUrl()) {
  <div class="link-row">
    <div class="link-value">
      <a [href]="getLinkUrl()" target="_blank" rel="noopener noreferrer" class="link">
        {{ getLinkUrl() }}
      </a>
    </div>
    <div class="link-actions">
      <ng-content select="[ngsCommentEditorCommandEditLink],[ngsCommentEditorCommandUnsetLink]"/>
    </div>
  </div>
}
<div class="commands-row">
  <ng-content select="[ngsCommentEditorCommand],ngs-comment-editor-divider"/>
</div>
