<ngs-alert [variant]="appearance()" [class.settings-open]="settingsTrigger.menuOpen()">
  <ng-template ngsAlertIcon><ngs-icon [name]="icon()"/></ng-template>
  <div class="min-w-0 break-words outline-none" [ngsContentEditorContentEditable]="content()" [props]="props()"
    (propsChanged)="store.updateBlock(id(), {props: $event})" (contentChanged)="changeText($event)" data-empty-placeholder="Write a note…"></div>
  <button ngsIconButton ngsAlertAction [ngsMenuTriggerFor]="variantMenu" #settingsTrigger="ngsMenuTrigger"
    aria-label="Callout style"><ngs-icon name="fluent:more-horizontal-24-regular"/></button>
</ngs-alert>
<ngs-menu #variantMenu>
  @for (variant of variants; track variant) { <button ngs-menu-item (click)="changeVariant(variant)">{{variant}}</button> }
</ngs-menu>
