@if (href()) {
  <div class="flex items-center gap-3">
    <ngs-icon name="fluent:document-24-regular"/>
    <div class="min-w-0 flex-1"><div class="truncate">{{content()?.name}}</div><div class="text-xs">{{sizeLabel()}} · {{content()?.mimeType}}</div></div>
    <a ngsButton [href]="href()" [attr.download]="content()?.name" target="_blank" rel="noopener noreferrer">Download</a>
  </div>
}
