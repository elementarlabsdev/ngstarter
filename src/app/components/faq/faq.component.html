<section id="faq" class="bg-surface px-6 py-24 sm:px-8 lg:px-10 lg:py-32">
  <div class="mx-auto max-w-4xl">
    <div class="mb-10 text-center">
      <p class="mb-3 text-sm font-semibold uppercase tracking-wide text-primary">FAQ</p>
      <h2 class="text-3xl font-bold text-on-background">Angular UI components licensing questions</h2>
      <p class="mx-auto mt-4 max-w-2xl text-base leading-7 text-on-surface-variant">
        Practical answers for teams comparing NgStarter plans, commercial usage, source code access,
        and standalone Angular component support.
      </p>
    </div>

    <ngs-accordion class="block space-y-3">
      @for (faq of faqs; track faq.question) {
        <ngs-expansion-panel>
          <ngs-expansion-panel-header>
            <ngs-expansion-panel-title>{{ faq.question }}</ngs-expansion-panel-title>
            <ngs-expansion-panel-description>NgStarter</ngs-expansion-panel-description>
          </ngs-expansion-panel-header>
          <p class="leading-7 text-on-surface-variant">{{ faq.answer }}</p>
        </ngs-expansion-panel>
      }
    </ngs-accordion>
  </div>
</section>
