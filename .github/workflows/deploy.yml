name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for generating npm provenance statements

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Using GITHUB_TOKEN to push changes back to the repo
          # Note: If your branch is protected, you might need a Personal Access Token (PAT)
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          always-auth: true

      - name: Install dependencies
        run: npm ci

      - name: Update version
        id: versioning
        run: |
          # 1. Bump version in root package.json (e.g., 1.0.0 -> 1.0.1)
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          # 2. Export version to environment and outputs for subsequent steps
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # 3. Sync the new version to the nested components package.json
          node -e "
            const fs = require('fs');
            const path = 'projects/components/package.json';
            if (fs.existsSync(path)) {
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              pkg.version = '$NEW_VERSION';
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
              console.log('Successfully synced version ' + '$NEW_VERSION' + ' to ' + path);
            } else {
              console.error('Error: file not found ' + path);
              process.exit(1);
            }
          "

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json projects/components/package.json
          # Only commit and push if there are actual changes to avoid errors
          # [skip ci] is used to prevent the action from triggering itself in a loop
          git diff-index --quiet HEAD || (git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build components
        run: npm run build:components:prod

      - name: Publish to NPM
        run: |
          # Navigate to the distribution folder containing the built package
          cd dist/components
          npm publish --access public
        env:
          # Ensure NPM_TOKEN is set in your GitHub Repository Secrets
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run deploy script
        run: |
          chmod +x ./deploy-dockerhub.sh
          ./deploy-dockerhub.sh ${{ env.NEW_VERSION }}
