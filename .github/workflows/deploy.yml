name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for generating npm provenance statements

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Using GITHUB_TOKEN to push changes back to the repo
          # Note: If your branch is protected, you might need a Personal Access Token (PAT)
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          always-auth: true

      - name: Install dependencies
        run: npm ci

      - name: Check for component changes
        id: changed-components
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD^"
          fi

          if git diff --quiet "$BEFORE" "$AFTER" -- 'projects/components'; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify NPM publish credentials
        if: steps.changed-components.outputs.changed == 'true'
        run: |
          npm whoami --registry=https://registry.npmjs.org/
          npm access list collaborators @ngstarter-ui/components --registry=https://registry.npmjs.org/ >/dev/null
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update versions
        id: versioning
        run: |
          # 1. Bump version in root package.json
          npm version patch --no-git-tag-version
          ROOT_VERSION=$(node -p "require('./package.json').version")
          echo "ROOT_VERSION=$ROOT_VERSION" >> $GITHUB_ENV
          echo "root_version=$ROOT_VERSION" >> $GITHUB_OUTPUT

          # 2. Bump version in components package.json only if changed
          if [ "${{ steps.changed-components.outputs.changed }}" = "true" ]; then
            cd projects/components
            npm version patch --no-git-tag-version
            COMP_VERSION=$(node -p "require('./package.json').version")
            cd ../..
            echo "COMP_VERSION=$COMP_VERSION" >> $GITHUB_ENV
            echo "comp_version=$COMP_VERSION" >> $GITHUB_OUTPUT
            echo "COMPONENTS_CHANGED=true" >> $GITHUB_ENV
          else
            COMP_VERSION=$(node -p "require('./projects/components/package.json').version")
            echo "COMP_VERSION=$COMP_VERSION" >> $GITHUB_ENV
            echo "comp_version=$COMP_VERSION" >> $GITHUB_OUTPUT
            echo "COMPONENTS_CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json projects/components/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump versions (root: ${{ env.ROOT_VERSION }}, components: ${{ env.COMP_VERSION }}) [skip ci]"
            git status --porcelain
            test -z "$(git status --porcelain)"
            git pull --rebase origin main
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build components
        if: env.COMPONENTS_CHANGED == 'true'
        run: npm run build:components:prod

      - name: Publish to NPM
        if: env.COMPONENTS_CHANGED == 'true'
        run: |
          cd dist/components
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDKIT_MULTI_PLATFORM=1
          push: true
          tags: |
            elementarlabs/ngstarter:${{ env.ROOT_VERSION }}
            elementarlabs/ngstarter:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
